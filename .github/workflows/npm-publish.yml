name: publish npm package

# Publishes the react-native/ package (react-native-ffmpeg-kit) to npm.
# The `files` allowlist in react-native/package.json ensures the tarball ships
# the RN package only (src, android, ios, podspec) — not the rest of the monorepo.
#
# Trigger: push a 'v*' tag (e.g. v6.0.2) whose version matches
# react-native/package.json, or run manually.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-native
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: install dependencies
        run: yarn install --frozen-lockfile || yarn install

      - name: verify tag matches package version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match package version $PKG_VERSION"
            exit 1
          fi

      - name: publish
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-* ]]; then
            echo "Publishing prerelease $VERSION under dist-tag 'next' (opt-in via @next)"
            npm publish --provenance --access public --tag next
          else
            echo "Publishing $VERSION as 'latest'"
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
