name: ios ffmpeg binaries

# Builds the FFmpegKit iOS xcframework bundle(s) from source (this repo is the
# "binary factory") and publishes them as GitHub Release assets. The
# react-native package consumes them from the release by downloading the zip in
# its podspec (react-native/ffmpeg-kit-react-native.podspec), resolving:
#   https://github.com/<owner>/ffmpeg-kit/releases/download/<tag>/ffmpeg-kit-ios-<package>.xcframework.zip
#
# Trigger:
#   - workflow_dispatch: build on demand (uploads a workflow artifact)
#   - push tag 'ffmpeg-ios-*': build + attach the xcframework zips to that
#     release (the tag is what the podspec's ffmpeg_kit_release_tag must point
#     at, default 'ffmpeg-ios-6.0.2')

on:
  workflow_dispatch:
    inputs:
      xcode:
        description: 'Xcode version to select via DEVELOPER_DIR (must exist on the runner).'
        required: false
        default: '15.4'
      packages:
        description: 'Informational only; the matrix below drives the build.'
        required: false
        default: 'https, full-gpl'
  push:
    tags:
      - 'ffmpeg-ios-*'

jobs:
  build:
    name: build ${{ matrix.package }} xcframework
    # macos-14 is Apple silicon. This repo's ios.sh targets FFmpeg 6.0 (2023,
    # Xcode 13-15 era); the default toolchain on newer runners may be too new.
    # We pin Xcode via DEVELOPER_DIR below to a 6.0-friendly version.
    # TODO(validate): if the pinned Xcode is unavailable on the runner image, or
    # if FFmpeg 6.0 fails to compile against it, either bump the `xcode` input /
    # `default-xcode` env to a version present on the image (see
    # https://github.com/actions/runner-images) or fall back to macos-13.
    runs-on: macos-14
    env:
      # Xcode selected for the build. workflow_dispatch can override via the
      # `xcode` input; tag pushes use this default.
      DEFAULT_XCODE: '15.4'
    strategy:
      fail-fast: false
      matrix:
        include:
          # LGPL default: TLS/https support via OpenSSL (Apache-2.0; avoids the
          # gnutls autotools/autopoint bootstrap which breaks on modern macOS
          # gettext) plus the Apple system codecs.
          - package: https
            flags: '--enable-openssl --enable-ios-audiotoolbox --enable-ios-avfoundation --enable-ios-bzip2 --enable-ios-libiconv --enable-ios-videotoolbox --enable-ios-zlib'
          # Full + GPL: adds x264/x265/xvid/vid.stab etc. (effective license:
          # GPL v3). srt disabled to match the Android 'full-gpl' package.
          - package: full-gpl
            flags: '--full --enable-gpl --disable-lib-srt --enable-ios-audiotoolbox --enable-ios-avfoundation --enable-ios-bzip2 --enable-ios-libiconv --enable-ios-videotoolbox --enable-ios-zlib'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Full toolchain set required by the --full/--enable-gpl external
      # libraries (bison, meson/ninja, gettext, etc.). Harmless for 'https'.
      # Mirrors the upstream apple nightly build (periodic-builds-apple.yml).
      - name: prerequisites
        run: brew install autoconf automake libtool pkg-config curl git doxygen nasm gcc gperf texinfo yasm bison autogen wget gettext meson ninja ragel groff gtk-doc libtasn1 --overwrite

      # x265 and other older GPL libs (vid.stab, rubberband, zimg, ...) use
      # pre-4.0 CMake policies (CMP0025/CMP0054) whose OLD behavior CMake 4.x
      # (Homebrew's default) removed. Pin the official Kitware CMake 3.31.x so
      # their CMakeLists still configure. Prepended via GITHUB_PATH so it wins
      # over any preinstalled cmake.
      - name: pin cmake 3.x
        run: |
          curl -sL https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-macos-universal.tar.gz -o /tmp/cmake.tar.gz
          tar -xzf /tmp/cmake.tar.gz -C /tmp
          echo "/tmp/cmake-3.31.6-macos-universal/CMake.app/Contents/bin" >> "$GITHUB_PATH"

      - name: verify cmake version
        run: cmake --version

      # ios.sh sources ~/.xcode.for.ffmpeg.kit.sh (see ios.sh) to select the
      # Xcode/SDK used for the build. Pin a 6.0-friendly Xcode here.
      - name: set up xcode
        run: |
          XCODE_VERSION="${{ github.event.inputs.xcode || env.DEFAULT_XCODE }}"
          echo "export DEVELOPER_DIR=/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer" > ~/.xcode.for.ffmpeg.kit.sh
          cat ~/.xcode.for.ffmpeg.kit.sh

      # Reuse the proven invocation from periodic-builds-apple.yml: put brew's
      # bison ahead of the system one and point XML_CATALOG_FILES at brew's xml
      # catalog. brew --prefix keeps this correct on both Apple silicon
      # (/opt/homebrew) and Intel (/usr/local) runners.
      # TODO(validate): XML_CATALOG_FILES path assumes an xml catalog exists
      # under $(brew --prefix)/etc/xml/catalog (installed by libxml2/gtk-doc);
      # if a library's configure step complains about missing catalogs, install
      # it or drop the override.
      - name: build ffmpeg-kit (${{ matrix.package }})
        run: |
          export PATH="$(brew --prefix bison)/bin:$PATH"
          export XML_CATALOG_FILES="$(brew --prefix)/etc/xml/catalog"
          ./ios.sh --xcframework ${{ matrix.flags }}

      # ios.sh emits every per-library *.xcframework plus the ffmpegkit.xcframework
      # umbrella under prebuilt/bundle-apple-xcframework-ios (see
      # scripts/function-apple.sh get_xcframework_directory(), with
      # FFMPEG_KIT_BUILD_TYPE=ios and no --lts). Zip the *contents* of that
      # directory so the *.xcframework bundles sit at the zip root (the podspec's
      # prepare_command unzips them flat and vendors *.xcframework).
      - name: package xcframeworks into a zip
        run: |
          OUT_DIR="prebuilt/bundle-apple-xcframework-ios"
          test -d "$OUT_DIR" || { echo "xcframework output dir not found: $OUT_DIR"; ls -la prebuilt || true; exit 1; }
          mkdir -p dist
          ( cd "$OUT_DIR" && zip -r -y "$GITHUB_WORKSPACE/dist/ffmpeg-kit-ios-${{ matrix.package }}.xcframework.zip" . )
          ls -lh dist

      - name: print build logs
        if: ${{ always() }}
        run: tail -200 build.log || true

      - name: print ffmpeg config log on failure
        if: ${{ failure() }}
        run: '[[ -f ./src/ffmpeg/ffbuild/config.log ]] && tail -80 ./src/ffmpeg/ffbuild/config.log || true'

      - name: upload workflow artifact (dispatch runs)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-kit-ios-${{ matrix.package }}-xcframework
          path: dist/ffmpeg-kit-ios-${{ matrix.package }}.xcframework.zip
          if-no-files-found: error

      - name: attach to github release (tag runs)
        if: ${{ startsWith(github.ref, 'refs/tags/ffmpeg-ios-') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FFmpegKit iOS binaries ${{ github.ref_name }}
          files: dist/ffmpeg-kit-ios-${{ matrix.package }}.xcframework.zip
