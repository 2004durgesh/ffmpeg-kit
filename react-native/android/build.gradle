buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    classpath "com.facebook.react:react-native-gradle-plugin"
  }
}

apply plugin: "com.android.library"
apply plugin: "com.facebook.react"

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace "com.arthenica.ffmpegkit.reactnative"

  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 34)
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

repositories {
  google()
  mavenCentral()
}

// FFmpeg native binaries (AAR) are published as GitHub Release assets by the
// "android ffmpeg binaries" workflow. Gradle repositories are NOT inherited by
// consumers, so rather than a custom repo (which every consuming app would have
// to re-declare) we download the AAR at configuration time and consume it as a
// local file dependency -- a file dependency DOES flow into the consuming app's
// runtime classpath with no extra setup. Override via root-project ext:
//   ffmpegKitPackage    (default "https"; e.g. "full-gpl")
//   ffmpegKitReleaseTag (default "ffmpeg-android-6.0.2")
//   ffmpegKitRepo       (default "2004durgesh/ffmpeg-kit")
def ffmpegKitPackage = safeExtGet('ffmpegKitPackage', 'https')
def ffmpegKitReleaseTag = safeExtGet('ffmpegKitReleaseTag', 'ffmpeg-android-6.0.2')
def ffmpegKitRepo = safeExtGet('ffmpegKitRepo', '2004durgesh/ffmpeg-kit')
def ffmpegKitAar = new File(layout.buildDirectory.get().asFile, "ffmpeg-kit/ffmpeg-kit-${ffmpegKitPackage}.aar")
if (!ffmpegKitAar.exists()) {
  ffmpegKitAar.parentFile.mkdirs()
  def ffmpegKitAarUrl = "https://github.com/${ffmpegKitRepo}/releases/download/${ffmpegKitReleaseTag}/ffmpeg-kit-${ffmpegKitPackage}.aar"
  logger.lifecycle("react-native-ffmpeg-kit: downloading ${ffmpegKitAarUrl}")
  ant.get(src: ffmpegKitAarUrl, dest: ffmpegKitAar)
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation files(ffmpegKitAar)

  // ffmpeg-kit's own runtime dependency. The AAR is consumed as a local file()
  // dependency (above), which carries no transitive deps, so declare it here or
  // FFmpegKitConfig.<clinit> throws NoClassDefFoundError for smartexception.
  implementation "com.arthenica:smart-exception-java:0.2.1"
}
