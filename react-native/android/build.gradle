buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    classpath "com.facebook.react:react-native-gradle-plugin"
  }
}

apply plugin: "com.android.library"
apply plugin: "com.facebook.react"

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace "com.arthenica.ffmpegkit.reactnative"

  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 34)
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

repositories {
  google()
  mavenCentral()

  // FFmpeg AARs published as GitHub Release assets by the "android ffmpeg
  // binaries" workflow. This ivy repo maps a maven-style coordinate onto the
  // release asset URL (no authentication required):
  //   com.arthenica.ffmpegkit:ffmpeg-kit-<package>:<tag>
  //     -> .../releases/download/<tag>/ffmpeg-kit-<package>.aar
  ivy {
    url "https://github.com/2004durgesh/ffmpeg-kit/releases/download"
    patternLayout {
      artifact "[revision]/[artifact].[ext]"
    }
    metadataSources { artifact() }
    content { includeGroup "com.arthenica.ffmpegkit" }
  }
}

dependencies {
  implementation "com.facebook.react:react-android"

  // FFmpeg native binaries (AAR) resolved from the GitHub Release above. Override
  // via root-project ext: ffmpegKitPackage (default "https"; e.g. "full-gpl") and
  // ffmpegKitReleaseTag (default "ffmpeg-android-6.0.2").
  implementation "com.arthenica.ffmpegkit:ffmpeg-kit-${safeExtGet('ffmpegKitPackage', 'https')}:${safeExtGet('ffmpegKitReleaseTag', 'ffmpeg-android-6.0.2')}@aar"
}
